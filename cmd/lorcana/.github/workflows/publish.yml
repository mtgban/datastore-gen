name: publish

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install b2
        run: pipx install b2

      - name: Fetch the TCGplayer catalog
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
        run: |
          # The dump tcgdumper writes nightly, published beside the datastore
          # this run is about to replace.
          b2 file download --no-progress \
            b2://mtgban-datastore/lorcana/tcgplayer-catalog.json.xz \
            tcgplayer-catalog.json.xz
          xz -d tcgplayer-catalog.json.xz

      - name: Build the datastore
        run: |
          # vars.DATASTORE_LORCANA overrides the upstream location when set
          # (it lives on go-mtgban today, not at the org level), so there is
          # one place to change if LorcanaJSON moves.
          go run . -tcg-catalog tcgplayer-catalog.json \
            -lorcana "${{ vars.DATASTORE_LORCANA || 'https://lorcanajson.org/files/current/en/allCards.json' }}" \
            -o lorcana.json
          # Consumers decompress by suffix (simplecloud.InitReader), so the
          # published object keeps the .xz extension.
          xz -9 lorcana.json
          ls -l lorcana.json.xz

      - name: Keep a copy on the run
        uses: actions/upload-artifact@v7
        with:
          name: lorcana.json.xz
          path: lorcana.json.xz
          retention-days: 7

      - name: Publish to B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
        run: |
          b2 file upload --no-progress mtgban-datastore lorcana.json.xz lorcana/lorcana.json.xz
