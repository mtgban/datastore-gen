name: publish

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install b2
        run: pipx install b2

      - name: Fetch the TCGplayer catalog
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
        run: |
          # The dump tcgdumper writes nightly, published beside the datastore
          # this run is about to replace.
          b2 file download --no-progress \
            b2://mtgban-datastore/riftbound/tcgplayer-catalog.json.xz \
            tcgplayer-catalog.json.xz
          xz -d tcgplayer-catalog.json.xz

      - name: Build the datastore
        run: |
          go run . -tcg-catalog tcgplayer-catalog.json -o riftbound.json
          # Consumers decompress by suffix (simplecloud.InitReader), so the
          # published object keeps the .xz extension.
          xz -9 riftbound.json
          ls -l riftbound.json.xz

      - name: Keep a copy on the run
        uses: actions/upload-artifact@v4
        with:
          name: riftbound.json.xz
          path: riftbound.json.xz
          retention-days: 7

      - name: Publish to B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
        run: |
          b2 file upload --no-progress mtgban-datastore riftbound.json.xz riftbound/riftbound.json.xz
