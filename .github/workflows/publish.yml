name: publish

run-name: publish (${{ inputs.game || 'all' }})

on:
  workflow_dispatch:
    inputs:
      rebaseline:
        description: Ignore the baseline for this run and reset it to what the build holds
        type: boolean
        default: false
      game:
        description: Which datastore to publish
        type: choice
        default: all
        options:
          - all
          - riftbound
          - lorcana
          - onepiece
          - yugioh
          - fleshandblood
          - pokemon
          - gundam
          - palworld
  schedule:
    # Two hours after the catalog dump (05:00 UTC in go-tcgplayer)
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  # Scheduled runs publish everything, manual runs honor the selection. The
  # matrix context is not available in a job level if, so the selection is
  # applied by building the matrix itself.
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTED: ${{ inputs.game || 'all' }}
        run: |
          games='["riftbound", "lorcana", "onepiece", "yugioh", "fleshandblood", "pokemon", "gundam", "palworld"]'
          if [ "$SELECTED" = all ]; then
            selection=$(jq -c . <<< "$games")
          else
            selection=$(jq -c --arg name "$SELECTED" \
              '[.[] | select(. == $name)]' <<< "$games")
          fi
          echo "Publishing: $selection"
          echo "matrix=$selection" >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    runs-on: ubuntu-latest
    strategy:
      # One game at a time to keep the object store writes tidy
      max-parallel: 1
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install b2
        run: pipx install b2

      - name: Fetch the TCGplayer catalog
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
        run: |
          # The dump tcgdumper writes nightly, published beside the datastore
          # this run is about to replace.
          b2 file download --no-progress \
            b2://mtgban-datastore/${{ matrix.game }}/tcgplayer-catalog.json.xz \
            tcgplayer-catalog.json.xz
          xz -d tcgplayer-catalog.json.xz

          # The baseline the build measures itself against, so a run that
          # lost a large share of it stops here instead of publishing. It is
          # its own object rather than the published datastore because it
          # only ever moves forward: a build that legitimately came in a
          # little smaller still publishes, but does not become the thing
          # the next run is measured against, or a run of individually
          # tolerated drops would ratchet the baseline down a step a night
          # and the whole loss would never be large enough for any single
          # run to see.
          #
          # A game whose baseline has not been written yet falls back to the
          # published datastore, which seeds it; a game with nothing
          # published at all has neither, and that is not an error - it
          # builds without a baseline the one time there is none to have.
          if b2 file download --no-progress \
            b2://mtgban-datastore/${{ matrix.game }}/${{ matrix.game }}.baseline.json.xz \
            previous.json.xz; then
            xz -d previous.json.xz
          elif b2 file download --no-progress \
            b2://mtgban-datastore/${{ matrix.game }}/${{ matrix.game }}.json.xz \
            previous.json.xz; then
            echo "no baseline for ${{ matrix.game }} yet; seeding from the published datastore"
            xz -d previous.json.xz
          else
            echo "nothing published yet for ${{ matrix.game }}; building without a baseline"
          fi

          # tcgdex answers DNS by where the question comes from, and its
          # American record has pointed at a dead server for days while the
          # European one answers - so every resolver a US runner can ask,
          # public ones included, hands back an address nothing serves.
          # Resolution alone cannot route around that. Each candidate is
          # health-probed instead and the first that actually answers is
          # pinned for this job alone: the resolver's answer first, then
          # the European geo record as of 2026-08, which the probe gate
          # reduces to one wasted request the day it goes stale. No address
          # is ever pinned unprobed, and when none answers the system
          # resolver stands - the builder then retries and falls back to
          # the cached responses below.
          if [ "${{ matrix.game }}" = pokemon ]; then
            resolved=$(dig +short api.tcgdex.net A @1.1.1.1 | grep -E '^[0-9.]+$' | head -1)
            for cand in $resolved 217.182.193.43; do
              if curl -sf -o /dev/null --max-time 8 \
                --resolve "api.tcgdex.net:443:$cand" https://api.tcgdex.net/v2/en/sets; then
                echo "$cand api.tcgdex.net" | sudo tee -a /etc/hosts
                break
              fi
              echo "api.tcgdex.net at $cand does not answer"
            done
          fi

          # The last tcgdex responses a build fetched live, kept beside the
          # datastore so a run that cannot reach the API builds on them
          # instead of publishing nothing. The builder asks the live API
          # first and refreshes these whenever it answers.
          if [ "${{ matrix.game }}" = pokemon ]; then
            for f in tcgdex-sets tcgdex-cards; do
              if b2 file download --no-progress \
                b2://mtgban-datastore/pokemon/$f.json.xz $f.json.xz; then
                xz -d $f.json.xz
              else
                echo "no cached $f yet; the live fetch has to answer"
              fi
            done
          fi

      - name: Build the datastore
        env:
          # Overrides the upstream LorcanaJSON location when set (it lives
          # on go-mtgban today, not at the org level), so there is one place
          # to change if LorcanaJSON moves.
          DATASTORE_LORCANA: ${{ vars.DATASTORE_LORCANA }}
        run: |
          args=""
          if [ "${{ matrix.game }}" = lorcana ]; then
            args="-lorcana ${DATASTORE_LORCANA:-https://lorcanajson.org/files/current/en/allCards.json}"
          fi
          # A rebaseline run ignores the baseline and resets it to whatever
          # this build holds, the way out of a baseline left standing above
          # a genuine, lasting shrinkage.
          if [ -f previous.json ] && [ "${{ inputs.rebaseline }}" != "true" ]; then
            args="$args -against previous.json"
          fi
          if [ "${{ matrix.game }}" = pokemon ]; then
            args="$args -tcgdex-cache ."
          fi
          go run ./cmd/${{ matrix.game }} -tcg-catalog tcgplayer-catalog.json \
            $args -baseline-fit baseline.fit -o ${{ matrix.game }}.json
          # Consumers decompress by suffix (simplecloud.InitReader), so the
          # published object keeps the .xz extension.
          xz -9 ${{ matrix.game }}.json
          ls -l ${{ matrix.game }}.json.xz

      - name: Keep a copy on the run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game }}.json.xz
          path: ${{ matrix.game }}.json.xz
          retention-days: 7

      - name: Publish to B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
        run: |
          b2 file upload --no-progress mtgban-datastore \
            ${{ matrix.game }}.json.xz ${{ matrix.game }}/${{ matrix.game }}.json.xz

          # The build writes baseline.fit only when it holds at least as
          # much as the baseline it was measured against, so the object the
          # next run compares itself to never moves backwards. Same bytes,
          # a second name.
          if [ -f baseline.fit ]; then
            echo "promoting this build to the baseline: $(cat baseline.fit)"
            b2 file upload --no-progress mtgban-datastore \
              ${{ matrix.game }}.json.xz \
              ${{ matrix.game }}/${{ matrix.game }}.baseline.json.xz
          else
            echo "baseline left where it was; this build holds less than it does"
          fi

          # Keep the tcgdex responses this build ran on, live-fetched or
          # cached alike: what built a published datastore is always fit
          # to be the fallback for the next run.
          if [ "${{ matrix.game }}" = pokemon ]; then
            for f in tcgdex-sets tcgdex-cards; do
              if [ -f $f.json ]; then
                xz -9 -f $f.json
                b2 file upload --no-progress mtgban-datastore \
                  $f.json.xz pokemon/$f.json.xz
              fi
            done
          fi

      # A published datastore reaches the site when the site is told to
      # reload it. Until now nothing here said so, and a publish only went
      # live when one of go-mtgban's scraper workflows next happened to ping
      # the same endpoint for its own reasons - which for a quiet game is
      # hours after the upload.
      #
      # Gated on the game, because publishing a datastore and serving one are
      # separate things: a builder can land here before its site exists, and
      # this step fails the job when the host does not answer. RELOAD_GAMES
      # names the games whose site is ready to be told, so a new builder
      # publishes quietly until it is added. The match is on whole words -
      # a substring test would let "piece" stand for "onepiece".
      - name: Tell the site to reload
        env:
          BAN_SECRET: "${{ secrets.BAN_SECRET }}"
          RELOAD_GAMES: "${{ vars.RELOAD_GAMES }}"
          GAME: ${{ matrix.game }}
        run: |
          case " ${RELOAD_GAMES:-} " in
          *" $GAME "*) ;;
          *)
            echo "$GAME is not in RELOAD_GAMES (${RELOAD_GAMES:-unset}); published without asking the site to reload"
            exit 0
            ;;
          esac
          if [ -z "${BAN_SECRET:-}" ]; then
            echo "::warning::BAN_SECRET is not set; published without asking $GAME.mtgban.com to reload"
            exit 0
          fi

          # Each attempt signs a timestamp of its own: the signature covers
          # the timestamp, so a retry reusing the first would be refused as
          # a replay rather than served.
          for attempt in 1 2 3; do
            rm -f ping-response
            ts=$(date -u +%s)
            body=$(jq -n --arg ts "$ts" '{ts:($ts|tonumber)}')
            sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$BAN_SECRET" -binary | base64)

            code=$(curl -sS -L -X POST \
                -H 'Content-Type: application/json' \
                -H "X-Signature: $sig" \
                -H "X-Timestamp: $ts" \
                --data-raw "$body" \
                --connect-timeout 30 --max-time 900 \
                -o ping-response -w '%{http_code}' \
                "https://$GAME.mtgban.com/api/load/datastore") || code=000

            echo "attempt $attempt: HTTP $code"
            head -c 2000 ping-response 2>/dev/null || true; echo

            # Any 2xx is the request being taken. The reload runs on the
            # server's own time and answers the moment it starts, so waiting
            # here for a 200 waits for something that never comes.
            case "$code" in
            2*)
              if jq -e 'select(.status=="ok")' ping-response > /dev/null 2>&1; then
                exit 0
              fi
              ;;
            esac

            if [ "$attempt" != "3" ]; then
              sleep 60
            fi
          done

          echo "::error::$GAME.mtgban.com did not take the reload request after 3 attempts (last status ${code:-none}); the datastore is published, so re-run this job once the site is answering. Whether a reload it accepted then finished is on its admin page, not here."
          exit 1
