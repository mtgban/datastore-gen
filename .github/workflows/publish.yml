name: publish

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the datastore
        run: go run . -o riftbound.json

      - name: Keep a copy on the run
        uses: actions/upload-artifact@v4
        with:
          name: riftbound.json
          path: riftbound.json
          retention-days: 7

      - name: Publish to B2
        env:
          B2_APPLICATION_KEY_ID: "${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}"
          B2_APPLICATION_KEY: "${{ secrets.B2_APPLICATION_KEY_DATASTORE }}"
        run: |
          set -euo pipefail

          # The standalone binary avoids depending on the runner's Python
          # packaging (pip installs into an externally managed environment).
          curl -sSfL -o b2 \
              https://github.com/Backblaze/B2_Command_Line_Tool/releases/latest/download/b2-linux
          chmod +x b2

          ./b2 file upload --no-progress "${{ vars.B2_BUCKET }}" riftbound.json riftbound/riftbound.json
